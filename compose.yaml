---
name: fp-advisor

services:
  api:
    build:
      context: ./data
    image: kwf/fp-advisor:latest
    container_name: fp-advisor-api
    restart: unless-stopped
    command: ["uvicorn", "serve_api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - TZ=Asia/Jakarta
      - CHECKPOINT=/models/serving.pt
      - DEVICE=cpu
    volumes:
      - ./models:/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: ./data
    image: kwf/fp-advisor:latest
    container_name: fp-advisor-app
    restart: unless-stopped
    command: ["streamlit", "run", "app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true"]
    env_file:
      - .env
    environment:
      - TZ=Asia/Jakarta
      - API_URL=http://api:8000
      - DB_PATH=/storage/advisor.db
    volumes:
      - ./storage:/storage
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: fp-advisor-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    environment:
      - TZ=Asia/Jakarta
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:12.1.0
    container_name: fp-advisor-grafana
    restart: unless-stopped
    environment:
      - TZ=Asia/Jakarta
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/fp-advisor.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - frontend
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prometheus-data:
  grafana-data:

networks:
  frontend:
    external: true
  backend:
    external: true
